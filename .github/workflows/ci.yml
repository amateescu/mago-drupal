name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}${{ matrix.mago == 'lowest' && ', lowest Mago' || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.4', '8.5']
        mago: [highest]
        # composer.json allows every Mago 1.x from its lowest version on. The
        # other jobs install the newest one, and this job checks the lowest.
        include:
          - php: '8.1'
            mago: lowest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Set up Just
        uses: extractions/setup-just@v3

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install the lowest Mago
        if: matrix.mago == 'lowest'
        run: composer update carthage-software/mago --prefer-lowest --no-interaction --prefer-dist

      - name: Check
        run: just check-ci

  standards:
    name: Coding standards quotes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Set up Just
        uses: extractions/setup-just@v3

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      # The part of `just check-all` that clones Drupal's coding standards. It
      # runs once, and not in every job of the matrix.
      - name: Check the quotes
        run: just check-standards-quotes
