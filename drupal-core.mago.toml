# Mago settings for a Drupal core checkout, with core/, composer/ and vendor/ at the top. Extend
# this file from the checkout's mago.toml:
#
#     extends = "vendor/amateescu/mago-drupal/drupal-core.mago.toml"
#     php-version = "8.3"
#
# It changes drupal.mago.toml to check what core's phpcs.xml.dist checks. Each rule that it turns
# off can be turned back on in the checkout's mago.toml, as in
# "drupal/short-list" = { enabled = true } under [linter.rules].

extends = "drupal.mago.toml"

[source]
# The files that core's phpcs.xml.dist checks, and the extensions that it adds.
paths = ["core", "composer"]
includes = ["vendor"]
extensions = ["test"]
excludes = [
    "**/bower_components/**",
    "**/node_modules/**",
    "core/assets/vendor/",
    "core/.phpstan-baseline.php",
    "core/phpstan-tmp/",
    # The test fixtures of phpcs are .inc files that don't parse on purpose.
    "vendor/squizlabs/php_codesniffer/",
]

[extension-hosts.drupal]
# Core's phpcs and PHPStan runs rely on its phpcs:ignore and @phpstan-ignore comments, so the
# worker reads them for the extension's rules. This replaces the command of drupal.mago.toml as a
# whole.
command = ["php", "-d", "xdebug.mode=off", "-d", "pcov.enabled=0", "vendor/amateescu/mago-drupal/resources/worker.php", "--phpcs-ignores", "--phpstan-ignores"]

[formatter]
# The files that phpcs doesn't check. The analyzer still reads them, since core uses their classes.
excludes = [
    # Excluded by core's phpcs.xml.dist.
    "core/lib/Drupal/Component/Diff/",
    "core/tests/Drupal/Tests/Component/Annotation/Doctrine/",
    "core/modules/system/tests/fixtures/HtaccessTest/",
    # Marked with // phpcs:ignoreFile or // @codingStandardsIgnoreFile, which Mago's own rules don't
    # read.
    "core/assets/scaffold/files/default.settings.php",
    "core/assets/scaffold/files/example.settings.local.php",
    "core/assets/scaffold/files/example.sites.php",
    "core/lib/Drupal/Component/Annotation/Doctrine/",
    "core/lib/Drupal/Core/Config/Action/Exists.php",
    "core/lib/Drupal/Core/Database/DatabaseException.php",
    "core/lib/Drupal/Core/DependencyInjection/YamlFileLoader.php",
    "core/lib/Drupal/Core/ProxyClass/",
    "core/lib/Drupal/Core/Serialization/Yaml.php",
    "core/lib/Drupal/Core/Validation/ConstraintViolationBuilder.php",
    "core/modules/contact/tests/fixtures/",
    "core/modules/content_moderation/tests/fixtures/",
    "core/modules/migrate_drupal/tests/fixtures/",
    "core/modules/workspaces/tests/fixtures/",
    "core/tests/Drupal/Tests/DocumentElement.php",
    "core/tests/PHPStan/fixtures/",
    "core/tests/fixtures/empty_file.php.module",
    "core/tests/fixtures/files/",
]

[linter]
excludes = [
    # Excluded by core's phpcs.xml.dist.
    "core/lib/Drupal/Component/Diff/",
    "core/tests/Drupal/Tests/Component/Annotation/Doctrine/",
    "core/modules/system/tests/fixtures/HtaccessTest/",
    # Marked with // phpcs:ignoreFile or // @codingStandardsIgnoreFile, which Mago's own rules don't
    # read.
    "core/assets/scaffold/files/default.settings.php",
    "core/assets/scaffold/files/example.settings.local.php",
    "core/assets/scaffold/files/example.sites.php",
    "core/lib/Drupal/Component/Annotation/Doctrine/",
    "core/lib/Drupal/Core/Config/Action/Exists.php",
    "core/lib/Drupal/Core/Database/DatabaseException.php",
    "core/lib/Drupal/Core/DependencyInjection/YamlFileLoader.php",
    "core/lib/Drupal/Core/ProxyClass/",
    "core/lib/Drupal/Core/Serialization/Yaml.php",
    "core/lib/Drupal/Core/Validation/ConstraintViolationBuilder.php",
    "core/modules/contact/tests/fixtures/",
    "core/modules/content_moderation/tests/fixtures/",
    "core/modules/migrate_drupal/tests/fixtures/",
    "core/modules/workspaces/tests/fixtures/",
    "core/tests/Drupal/Tests/DocumentElement.php",
    "core/tests/PHPStan/fixtures/",
    "core/tests/fixtures/empty_file.php.module",
    "core/tests/fixtures/files/",
    # Broken on purpose, and left out of core's phpstan.neon.dist. Mago reports its abstract method
    # in a class that isn't abstract as a semantics error, which no setting turns off for one file.
    "core/modules/system/tests/modules/router_test_directory/src/Controller/TestInvalidController.php",
]

[linter.rules]
# Core's phpcs.xml.dist turns off the checks that these rules port, or doesn't run their sniffs.
"drupal/author-tag" = { enabled = false }
"drupal/case-fall-through" = { enabled = false }
"drupal/class-prefix" = { enabled = false }
"drupal/const-prefix" = { enabled = false }
"drupal/curl-ssl-verify" = { enabled = false }
"drupal/escaped-placeholder" = { enabled = false }
"drupal/form-alter-comment" = { enabled = false }
"drupal/function-name" = { enabled = false }
"drupal/function-prefix" = { enabled = false }
"drupal/global-constant" = { enabled = false }
"drupal/hook-attribute-name" = { enabled = false }
"drupal/info-core-version-requirement" = { enabled = false }
"drupal/info-dependencies-array" = { enabled = false }
"drupal/info-description" = { enabled = false }
"drupal/inline-comment-blank-line" = { enabled = false }
"drupal/inline-comment-punctuation" = { enabled = false }
"drupal/insecure-unserialize" = { enabled = false }
"drupal/long-description-punctuation" = { enabled = false }
"drupal/method-name" = { enabled = false }
"drupal/method-name-underscore" = { enabled = false }
"drupal/request-superglobal" = { enabled = false }
"drupal/routing-access" = { enabled = false }
"drupal/short-list" = { enabled = false }
"drupal/strict-config-schema" = { enabled = false }
"drupal/unsilenced-deprecation" = { enabled = false }
"drupal/untranslated-description" = { enabled = false }
"drupal/untranslated-options" = { enabled = false }
# This rule checks what no Coder sniff checks.
"drupal/global-class-backslash" = { enabled = false }
# These rules match Coder 9 sniffs that core's Coder 8 setup doesn't run. no-request-variable is the
# $_REQUEST half of the sniff that drupal/request-superglobal ports.
no-redundant-method-override = { enabled = false }
no-request-variable = { enabled = false }
single-class-per-file = { enabled = false }
# Core checks the case of a trait name, but not the "Trait" suffix.
trait-name = { psr = false }
# Core is the framework that sets PHP's runtime settings for the site.
no-ini-set = { enabled = false }
# These rules give general PHP advice and don't port any sniff that core's phpcs.xml.dist runs.
combine-consecutive-issets = { enabled = false }
explicit-octal = { enabled = false }
inline-variable-return = { enabled = false }
instanceof-stringable = { enabled = false }
loop-does-not-iterate = { enabled = false }
no-debug-symbols = { enabled = false }
no-duplicate-match-arm = { enabled = false }
no-insecure-comparison = { enabled = false }
no-literal-password = { enabled = false }
no-protected-in-final = { enabled = false }
no-redundant-continue = { enabled = false }
no-redundant-math = { enabled = false }
no-redundant-nullsafe = { enabled = false }
no-redundant-parentheses = { enabled = false }
no-sprintf-concat = { enabled = false }
no-variable-variable = { enabled = false }
require-preg-quote-delimiter = { enabled = false }
sensitive-parameter = { enabled = false }
str-contains = { enabled = false }
str-starts-with = { enabled = false }
strict-behavior = { enabled = false }
use-compound-assignment = { enabled = false }
# Core's phpcs.xml.dist leaves tests directories out of Drupal.Files.LineLength. phpcs matches the
# pattern in any case, so it also leaves out the Tests directories under src/.
"drupal/comment-line-length" = { exclude = ["**/tests/**", "**/Tests/**"] }
# The capital P in Parent is on purpose, inside a phpcs:disable range, which Mago's own rules don't
# read.
lowercase-keyword = { exclude = ["core/tests/Drupal/Tests/Component/Utility/ReflectionTest.php"] }
# Core's phpcs.xml.dist leaves the hook documentation and the transliteration tables out of the
# VariableAnalysis sniff.
"drupal/unused-variable" = { exclude = ["**/*.api.php", "core/lib/Drupal/Component/Transliteration/data/"] }
"drupal/variable-redeclaration" = { exclude = ["**/*.api.php", "core/lib/Drupal/Component/Transliteration/data/"] }

[analyzer]
# These checks are about modules that use core's API. Core's own phpstan.neon.dist ignores
# internal-class-extension, and core keeps the cacheability parameter commented out in its own list
# builders.
ignore = [
    "drupal/global-drupal-call",
    "drupal/internal-class-extension",
    "drupal/list-builder-cacheability",
    "drupal/static-entity-load",
    "drupal/untranslated-message",
]
# Core's phpstan.neon.dist leaves out these classes. They extend or use classes that don't exist,
# or are broken on purpose.
excludes = [
    "core/modules/system/tests/modules/plugin_test/src/Plugin/plugin_test/custom_annotation/ExtendingNonInstalledClass.php",
    "core/modules/system/tests/modules/plugin_test/src/Plugin/plugin_test/custom_annotation/UsingNonInstalledTraitClass.php",
    "core/modules/system/tests/modules/plugin_test/src/Plugin/plugin_test/fruit/ExtendingNonInstalledClass.php",
    "core/modules/system/tests/modules/router_test_directory/src/Controller/TestInvalidController.php",
    "core/modules/system/tests/modules/router_test_directory/src/Controller/TestMissingDependency.php",
]
