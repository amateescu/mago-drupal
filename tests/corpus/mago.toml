version = "1"
php-version = "8.1"

[source]
# The callback function check needs a file inside a module directory, and a
# file of that module the run leaves out, so only corpus_callbacks.module is
# analyzed.
paths = ["src", "modules/corpus_callbacks/corpus_callbacks.module"]
# Signatures for the Drupal functions the fixtures call. Read for symbols, not
# linted, so the analyzer half of the corpus run has something to check against.
includes = ["stubs", "modules/corpus_dep/src", "core/lib/Drupal/Core"]
# Drupal keeps procedural code in files PHP does not name `.php`, and several
# rules only fire inside those.
extensions = ["php", "module", "install", "inc", "theme", "profile", "engine", "yml"]

# The fixtures stand in for Drupal code, so they follow Drupal's layout: the
# comment rules measure lines and read comments the way Drupal writes them.
[formatter]
preset = "drupal"
# The formatter sorts imports, splits groups and statements with several names,
# and moves comments out of a `use` statement. The fixtures of
# drupal/use-leading-backslash need those shapes as written. Mago reads a YAML
# file as text outside PHP tags, which only the rules for info and routing files
# check, as in the Setup config.
excludes = ["src/UseLeadingBackslash.php", "**/*.yml"]

# `--deprecations=12` so src/DeprecationTargets.php can prove it.
[extension-hosts.drupal]
command = ["php", "../../resources/worker.php", "--deprecations=12"]
workers = 1

[analyzer]
excludes = ["**/*.yml"]
# Off by default; on here so IgnoreComments.php can prove it.
plugins = ["phpstan-ignores"]
