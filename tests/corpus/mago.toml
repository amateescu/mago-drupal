version = "1"
php-version = "8.1"

[source]
paths = ["src"]
# Signatures for the Drupal functions the fixtures call. Read for symbols, not
# linted, so the analyzer half of the corpus run has something to check against.
includes = ["stubs"]
# Drupal keeps procedural code in files PHP does not name `.php`, and several
# rules only fire inside those.
extensions = ["php", "module", "install", "inc", "theme", "profile", "engine"]

# The fixtures stand in for Drupal code, so they follow Drupal's layout: the
# comment rules measure lines and read comments the way Drupal writes them.
[formatter]
preset = "drupal"
# The formatter sorts imports, splits groups and statements with several names,
# and moves comments out of a `use` statement. The fixtures of
# drupal/use-leading-backslash need those shapes as written.
excludes = ["src/UseLeadingBackslash.php"]

[extension-hosts.drupal]
command = ["php", "../../resources/worker.php"]
workers = 1
