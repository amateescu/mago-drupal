[project]
site_name = "mago-drupal"
site_description = "Drupal's coding standard for the Mago linter."
repo_url = "https://github.com/amateescu/mago-drupal"
repo_name = "amateescu/mago-drupal"
edit_uri = "edit/main/docs/"
# Drupal Blue for the custom palette below.
extra_css = ["stylesheets/drupal.css"]

nav = [
  { "Start" = [
    { "Overview" = "index.md" },
    { "Install" = "setup/install.md" },
    { "Worker arguments" = "setup/worker-arguments.md" },
    { "Configuration" = "setup/configuration.md" },
    { "Fixes" = "setup/fixes.md" },
  ] },
  { "Linter" = [
    { "All rules" = "rules/index.md" },
    { "Bugs and security" = "rules/bugs-and-security.md" },
    { "Using the right API" = "rules/right-api.md" },
    { "Procedural files" = "rules/procedural-files.md" },
    { "Files and PHP tags" = "rules/files-and-tags.md" },
    { "Info and routing files" = "rules/info-and-routing-files.md" },
    { "Naming and imports" = "rules/naming-and-imports.md" },
    { "Statements and declarations" = "rules/statements.md" },
    { "Comment text" = "rules/comment-text.md" },
    { "Docblock structure" = "rules/docblock-structure.md" },
    { "DrupalPractice checks" = "rules/drupal-practice.md" },
    { "Drupal 7 era" = "rules/drupal-7.md" },
    { "Ported from phpstan-drupal" = "rules/phpstan-drupal.md" },
  ] },
  { "Analyzer" = [
    { "All checks" = "analyzer/index.md" },
    { "Services" = "analyzer/services.md" },
    { "Dependency injection" = "analyzer/injection.md" },
    { "Entities" = "analyzer/entities.md" },
    { "Config" = "analyzer/config.md" },
    { "Plugins" = "analyzer/plugins.md" },
    { "Render arrays and forms" = "analyzer/render-and-forms.md" },
    { "Translation" = "analyzer/translation.md" },
    { "Hooks and modules" = "analyzer/hooks.md" },
    { "Deprecations" = "analyzer/deprecations.md" },
    { "Traits" = "analyzer/traits.md" },
    { "Tests" = "analyzer/tests.md" },
    { "Core types and stubs" = "analyzer/core-types.md" },
    { "PHPStan ignores" = "analyzer/phpstan-ignores.md" },
  ] },
  { "Migrating" = [
    { "From Coder" = [
      { "Overview" = "coder/index.md" },
      { "Drupal standard" = "coder/drupal.md" },
      { "Sniffs from other standards" = "coder/other-standards.md" },
      { "DrupalPractice standard" = "coder/drupal-practice.md" },
    ] },
    { "From PHPStan" = [
      { "Overview" = "phpstan/index.md" },
      { "phpstan-drupal" = "phpstan/phpstan-drupal.md" },
      { "PHPStan identifiers" = "phpstan/identifiers.md" },
    ] },
  ] },
  { "Development" = "development.md" },
]

[project.theme]
favicon = "assets/favicon.png"
logo = "assets/favicon.png"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

# Split codes such as Drupal.Commenting.DocComment.ShortNotCapital at the dots
# and at each capital, so a search for one part finds them.
[project.plugins.search]
separator = '[\s\-,:!=\[\]()"/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'

[project.markdown_extensions]
tables = {}
# Collapsible `??? note` blocks, which hold the comparisons with Coder.
admonition = {}
pymdownx.details = {}
toc.permalink = true
pymdownx.highlight = {}
pymdownx.inlinehilite = {}
pymdownx.superfences = {}
